# ============================================================
# QRowg — CI
# Garde-fou d'imports + typecheck + tests unitaires a chaque push.
# Le DEPLOIEMENT est gere automatiquement par Vercel (integration GitHub),
# donc pas de job de deploy ici (evite la redondance + les secrets inutiles).
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # déclenche manuellement le job E2E Playwright (voir job "e2e")

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 🔍 Guard, Types & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # comme la production (engines 24.x, v361)
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Garde-fou imports (JSX / lucide)
        run: pnpm check:imports

      - name: Type check
        run: pnpm type-check

      - name: Tests unitaires
        run: pnpm test

  # ── Filet navigateur (vague 4, point 2) — À CHAQUE PUSH ──
  # Les parcours de l'argent, de la redirection et de la session, en SESSION
  # SIMULÉE : aucun secret, aucune base. L'adresse Supabase est volontairement
  # fausse (le domaine n'existe pas) ; sessionSimulee.ts intercepte les appels
  # du navigateur. Mesuré le 24 nov. dans ces conditions : 27 tests, ~4 min.
  # La liste vit dans package.json (test:e2e:filet) ; garde : filetNavigateur.test.ts.
  filet:
    name: 🎭 Filet navigateur (session simulée)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (filet)
        run: pnpm test:e2e:filet
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://bancdeci00000000000000.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-anonyme-de-banc
          NEXT_PUBLIC_APP_URL: http://localhost:3100
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: filet-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── QA navigateur Playwright (B11) — MANUEL uniquement (workflow_dispatch) ──
  # Ne s'exécute pas sur chaque push : le serveur Next dev requiert des variables
  # d'environnement (NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY au minimum).
  # Configurer ces secrets côté repo, puis lancer ce workflow à la main. Périmètre : tests
  # PUBLICS (smoke landing + harness des 51 blocs shared). Les parcours authentifiés
  # nécessitent en plus E2E_TEST_EMAIL / E2E_TEST_PASSWORD (compte de test dédié).
  e2e:
    name: 🎭 Playwright (public, manuel)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # comme la production (engines 24.x, v361)
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (smoke + blocs shared)
        run: pnpm test:e2e --grep "landing|51 blocs"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3100
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
